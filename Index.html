<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#126b45">
<title>Credenciamento — IV Congresso Estadual das APAEs</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#172033
}
.header{
  background:#126b45;
  color:#fff;
  padding:20px 16px;
  text-align:center;
  border-radius:0 0 18px 18px
}
.header h1{margin:0 0 6px;font-size:21px}
.header p{margin:0;font-size:13px;opacity:.9}
.container{max-width:540px;margin:auto;padding:14px}
.card{
  background:#fff;
  margin:12px 0;
  padding:16px;
  border-radius:15px;
  box-shadow:0 3px 14px #0001
}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:0 0 6px
}
input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  margin-bottom:12px
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#126b45;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
button.secondary{background:#475569}
#video{
  width:100%;
  display:none;
  border-radius:12px;
  background:#000;
  margin-top:14px
}
.status{
  padding:10px;
  border-radius:10px;
  background:#f8fafc;
  margin-top:10px;
  font-size:13px
}
.result{
  margin-top:14px;
  padding:16px;
  border-radius:12px;
  line-height:1.5
}
.success{background:#ecfdf3;border:1px solid #86efac}
.warning{background:#fff7ed;border:1px solid #fdba74}
.error{background:#fef2f2;border:1px solid #fca5a5}
.info{background:#eff6ff;border:1px solid #93c5fd}
.name{font-size:20px;font-weight:bold;margin:5px 0}
.muted{font-size:13px;color:#64748b}
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#64748b;
  font-size:12px;
  margin:15px 0
}
.divider:before,.divider:after{
  content:"";
  height:1px;
  background:#e2e8f0;
  flex:1
}
.small{font-size:12px;color:#64748b;margin-top:8px}
</style>
</head>

<body>

<div class="header">
  <h1>IV Congresso Estadual das APAEs</h1>
  <p>PA — Sistema de Credenciamento</p>
</div>

<div class="container">

<div class="card">
  <label>Nome do atendente</label>
  <input id="operador" placeholder="Ex.: Maria">

  <label>Posto de credenciamento</label>
  <input id="dispositivo" placeholder="Ex.: Mesa 01">
</div>

<div class="card">

  <button id="btnCamera" onclick="toggleCamera()">
    📷 ESCANEAR QR CODE
  </button>

  <video id="video" playsinline autoplay muted></video>

  <div id="cameraStatus" class="status">
    Câmera ainda não iniciada.
  </div>

  <div class="small">
    A página precisa estar em HTTPS para acessar a câmera.
  </div>

  <div class="divider">ou</div>

  <label>Digite o TOKEN</label>

  <input
    id="tokenManual"
    placeholder="Ex.: EVT-A83F91C2D7E451"
    autocomplete="off"
  >

  <button class="secondary" onclick="consultarManual()">
    CONSULTAR TOKEN
  </button>

  <div id="mensagem"></div>

</div>

</div>

<script>
/*
 * COLOQUE A URL /exec DA SUA API AQUI.
 *
 * Exemplo:
 * https://script.google.com/macros/s/ABC123.../exec
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbwV-RmaF7YRqgfxDSgJ4_YpUsCGdai9IFpgQkDlwG8gcoYg3NSYnwNHeT-5E3mZLA_p/exec';


let stream = null;
let scanning = false;
let raf = null;
let canvas = null;
let ctx = null;


/**
 * Escapa texto para evitar HTML injection.
 */
function esc(v){
  return String(v ?? '').replace(
    /[&<>"']/g,
    function(c){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c];
    }
  );
}


/**
 * JSONP.
 *
 * Isso permite que a página externa converse
 * com o Google Apps Script sem depender de CORS.
 */
function api(action, params, callback){

  if(API_URL === 'COLE_AQUI_A_URL_DO_APPS_SCRIPT'){
    callback({
      ok:false,
      mensagem:'Configure primeiro a URL do Apps Script no index.html.'
    });
    return;
  }

  const callbackName =
    'apiCallback_' +
    Date.now() +
    '_' +
    Math.floor(Math.random()*10000);

  const script = document.createElement('script');

  const query = new URLSearchParams();

  query.set('action', action);
  query.set('callback', callbackName);

  Object.keys(params || {}).forEach(function(key){
    query.set(key, params[key] ?? '');
  });

  window[callbackName] = function(data){
    try{
      callback(data);
    }finally{
      delete window[callbackName];
      script.remove();
    }
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();

    callback({
      ok:false,
      mensagem:'Não foi possível comunicar com o servidor de credenciamento.'
    });
  };

  script.src = API_URL + '?' + query.toString();

  document.body.appendChild(script);
}


/**
 * Testa API.
 */
function testarAPI(){

  api(
    'status',
    {},
    function(r){

      if(r.ok){
        document.getElementById('cameraStatus').innerHTML =
          '✓ Sistema online — API V'+esc(r.versao);
      }

    }
  );
}


/**
 * Câmera.
 */
function toggleCamera(){

  if(scanning){
    stopCamera();
  }else{
    startCamera();
  }

}


async function startCamera(){

  limpar();
  stopCamera();

  const video =
    document.getElementById('video');

  const status =
    document.getElementById('cameraStatus');


  if(typeof jsQR === 'undefined'){

    status.innerHTML =
      '❌ Biblioteca QR não carregada.';

    mostrar(
      'error',
      '<b>Leitor QR indisponível.</b><br>'+
      'Verifique a internet ou use o TOKEN manual.'
    );

    return;
  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    status.innerHTML =
      '❌ Este navegador não permite acesso à câmera.';

    mostrar(
      'error',
      '<b>Câmera indisponível.</b><br>'+
      'Use o TOKEN manual.'
    );

    return;
  }


  try{

    status.innerHTML =
      '⏳ Solicitando acesso à câmera...';


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

        audio:false
      });


    video.srcObject = stream;

    video.style.display = 'block';

    await video.play();


    canvas =
      document.createElement('canvas');

    ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently:true
        }
      );


    scanning = true;

    document.getElementById(
      'btnCamera'
    ).textContent =
      '⏹ PARAR CÂMERA';


    status.innerHTML =
      '✓ Câmera ativa — aponte para o QR Code.';


    scan();

  }catch(e){

    stopCamera();

    let detalhe =
      'Não foi possível acessar a câmera.';

    if(e.name === 'NotAllowedError'){
      detalhe =
        'Permissão da câmera bloqueada.';
    }

    else if(e.name === 'NotFoundError'){
      detalhe =
        'Nenhuma câmera foi encontrada.';
    }

    else if(e.name === 'NotReadableError'){
      detalhe =
        'A câmera está sendo usada por outro aplicativo.';
    }


    status.innerHTML =
      '❌ ' + detalhe;


    mostrar(
      'error',
      '<b>Não foi possível iniciar a câmera.</b><br>'+
      esc(detalhe)+
      '<br><br>'+
      'Se a câmera estiver bloqueada, abra as permissões do navegador e permita o acesso.'
    );

  }

}


/**
 * Procura QR nos frames.
 */
function scan(){

  if(!scanning){
    return;
  }


  const video =
    document.getElementById('video');


  if(
    video.readyState >= 2 &&
    video.videoWidth > 0
  ){

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const image =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    try{

      const code =
        jsQR(
          image.data,
          image.width,
          image.height,
          {
            inversionAttempts:'attemptBoth'
          }
        );


      if(code && code.data){

        const token =
          String(code.data)
            .trim()
            .toUpperCase();


        stopCamera();

        consultar(token);

        return;
      }

    }catch(e){
      console.log(e);
    }

  }


  raf =
    requestAnimationFrame(scan);
}


/**
 * Para câmera.
 */
function stopCamera(){

  scanning = false;


  if(raf){
    cancelAnimationFrame(raf);
  }

  raf = null;


  if(stream){

    stream
      .getTracks()
      .forEach(function(track){
        track.stop();
      });

    stream = null;
  }


  const video =
    document.getElementById('video');


  video.pause();

  video.srcObject = null;

  video.style.display = 'none';


  document.getElementById(
    'btnCamera'
  ).textContent =
    '📷 ESCANEAR QR CODE';
}


/**
 * Consulta manual.
 */
function consultarManual(){

  const token =
    document
      .getElementById('tokenManual')
      .value
      .trim()
      .toUpperCase();


  if(!token){

    mostrar(
      'warning',
      '<b>Digite um TOKEN.</b>'
    );

    return;
  }


  consultar(token);
}


/**
 * Consulta API.
 */
function consultar(token){

  mostrar(
    'info',
    '🔎 Consultando participante...'
  );


  api(
    'consultar',
    {
      token:token
    },

    function(p){

      if(!p.ok){

        mostrar(
          'error',
          '<b>QR/TOKEN NÃO ENCONTRADO</b><br><br>'+
          esc(p.mensagem)+
          '<br><br>'+
          '<button class="secondary" onclick="novo()">'+
          'NOVO CREDENCIAMENTO'+
          '</button>'
        );

        return;
      }


      if(p.credenciado){

        mostrar(
          'warning',

          '<b>⚠ PARTICIPANTE JÁ CREDENCIADO</b>'+

          '<div class="name">'+
          esc(p.nome)+
          '</div>'+

          '<div>CPF: '+
          esc(p.cpf)+
          '</div>'+

          '<br>'+

          '<button class="secondary" onclick="novo()">'+
          'NOVO CREDENCIAMENTO'+
          '</button>'
        );

        return;
      }


      mostrar(
        'success',

        '<div class="muted">'+
        'PARTICIPANTE ENCONTRADO'+
        '</div>'+

        '<div class="name">'+
        esc(p.nome)+
        '</div>'+

        '<div>CPF: '+
        esc(p.cpf)+
        '</div>'+

        '<br>'+

        '<button onclick="confirmar(\''+
        escJS(p.token)+
        '\')">'+
        '✓ CONFIRMAR CREDENCIAMENTO'+
        '</button>'+

        '<br><br>'+

        '<button class="secondary" onclick="novo()">'+
        'CANCELAR'+
        '</button>'
      );

    }
  );
}


/**
 * Confirma credenciamento.
 */
function confirmar(token){

  const operador =
    document
      .getElementById('operador')
      .value
      .trim();


  const dispositivo =
    document
      .getElementById('dispositivo')
      .value
      .trim();


  if(!operador){

    mostrar(
      'warning',
      '<b>Informe o nome do atendente.</b>'
    );

    return;
  }


  mostrar(
    'info',
    '⏳ Registrando credenciamento...'
  );


  api(
    'credenciar',

    {
      token:token,
      operador:operador,
      dispositivo:dispositivo
    },

    function(r){

      if(r.ok){

        document
          .getElementById('tokenManual')
          .value = '';


        mostrar(
          'success',

          '<div style="font-size:30px;text-align:center">✓</div>'+

          '<div class="name" style="text-align:center">'+
          'CREDENCIAMENTO REALIZADO'+
          '</div>'+

          '<div style="text-align:center">'+
          esc(r.nome)+
          '</div>'+

          '<br>'+

          '<div style="text-align:center">'+
          esc(r.data)+
          ' às '+
          esc(r.hora)+
          '</div>'+

          '<br>'+

          '<button onclick="novo()">'+
          '📷 LER PRÓXIMO'+
          '</button>'
        );

      }else{

        mostrar(
          'warning',

          '<b>'+
          esc(r.mensagem)+
          '</b>'+

          '<br><br>'+

          '<button class="secondary" onclick="novo()">'+
          'NOVO CREDENCIAMENTO'+
          '</button>'
        );

      }

    }
  );

}


/**
 * Novo credenciamento.
 */
function novo(){

  document
    .getElementById('tokenManual')
    .value = '';

  limpar();

  stopCamera();

  document
    .getElementById('cameraStatus')
    .textContent =
      'Câmera ainda não iniciada.';
}


/**
 * Mensagens.
 */
function mostrar(tipo,html){

  const e =
    document.getElementById('mensagem');

  e.className =
    'result ' + tipo;

  e.innerHTML = html;
}


function limpar(){

  const e =
    document.getElementById('mensagem');

  e.className = '';

  e.innerHTML = '';
}


function escJS(v){

  return String(v ?? '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}


/*
 * Ao abrir a página, testa a API.
 */
window.addEventListener(
  'load',
  testarAPI
);
</script>

</body>
</html>
