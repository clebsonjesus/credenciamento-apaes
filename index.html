<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#126b45">
<title>Credenciamento — IV Congresso Estadual das APAEs</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
.header{
  background:#fff;
  padding:14px 14px 12px;
  text-align:center;
  border-bottom:5px solid #126b45;
  box-shadow:0 2px 12px #0001;
}
.logo{
  display:block;
  width:min(100%,760px);
  max-height:210px;
  object-fit:contain;
  margin:0 auto 6px;
}
.header .subtitle{
  margin:0;
  font-size:16px;
  font-weight:700;
  color:#126b45;
}
.header .api{
  font-size:12px;
  margin-top:7px;
}
.container{
  max-width:560px;
  margin:auto;
  padding:14px;
}
.card{
  background:#fff;
  margin:12px 0;
  padding:16px;
  border-radius:15px;
  box-shadow:0 3px 14px #0001;
}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:0 0 6px;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}
input:focus{
  border-color:#126b45;
  box-shadow:0 0 0 3px #126b4520;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#126b45;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{background:#475569}
button.successBtn{background:#15803d}
button:disabled{opacity:.6;cursor:not-allowed}
#video{
  width:100%;
  display:none;
  border-radius:12px;
  background:#000;
  margin-top:14px;
}
.cameraBox{
  position:relative;
}
.scanHint{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#ecfdf3;
  color:#166534;
  font-size:13px;
  text-align:center;
  font-weight:bold;
}
.status{
  padding:10px;
  border-radius:10px;
  background:#f8fafc;
  margin-top:10px;
  font-size:13px;
}
.result{
  margin-top:14px;
  padding:16px;
  border-radius:12px;
  line-height:1.5;
}
.success{background:#ecfdf3;border:1px solid #86efac}
.warning{background:#fff7ed;border:1px solid #fdba74}
.error{background:#fef2f2;border:1px solid #fca5a5}
.info{background:#eff6ff;border:1px solid #93c5fd}
.name{font-size:21px;font-weight:bold;margin:7px 0}
.muted{font-size:13px;color:#64748b}
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#64748b;
  font-size:12px;
  margin:15px 0;
}
.divider:before,.divider:after{
  content:"";
  height:1px;
  background:#e2e8f0;
  flex:1;
}
.smallNote{
  text-align:center;
  color:#64748b;
  font-size:12px;
  margin:12px 0 20px;
}
@media(max-width:600px){
  .logo{max-height:150px}
  .header{padding-top:8px}
  .container{padding:10px}
}
</style>
</head>

<main class="container">

  <section class="card">
    <label for="operador">Nome do atendente</label>
    <input id="operador" placeholder="Ex.: Maria" autocomplete="name">

    <label for="dispositivo">Posto de credenciamento</label>
    <input id="dispositivo" placeholder="Ex.: Mesa 01" autocomplete="off">
  </section>

  <section class="card">
    <button id="btnCamera" type="button" onclick="toggleCamera()">
      📷 ESCANEAR QR CODE
    </button>

    <div class="cameraBox">
      <video id="video" playsinline autoplay muted></video>
      <div id="scanHint" class="scanHint">
        ✓ Câmera ativa — aponte para o QR Code
      </div>
    </div>

    <div id="cameraStatus" class="status">
      Câmera pronta para iniciar.
    </div>

    <div class="divider">ou</div>

    <label for="tokenManual">Digite o TOKEN</label>
    <input
      id="tokenManual"
      placeholder="Ex.: APAE-XXXXXXXX"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false">

    <button class="secondary" type="button" onclick="consultarManual()">
      🔎 CONSULTAR TOKEN
    </button>

    <div id="mensagem"></div>
  </section>

  <div class="smallNote">
    Sistema de credenciamento — IV Congresso Estadual das APAEs do Pará
  </div>

</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwV-RmaF7YRqgfxDSgJ4_YpUsCGdai9IFpgQkDlwG8gcoYg3NSYnwNHeT-5E3mZLA_p/exec';

let stream=null, scanning=false, raf=null, canvas=null, ctx=null, busy=false;

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]))
}

function escJS(v){
  return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")
}

function api(action, params, callback){
  const cb='apiCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  const q=new URLSearchParams();

  q.set('action',action);
  q.set('callback',cb);

  Object.keys(params||{}).forEach(k=>q.set(k,params[k]??''));

  let finished=false;

  function finish(data){
    if(finished)return;
    finished=true;
    try{callback(data)}finally{
      delete window[cb];
      script.remove();
    }
  }

  window[cb]=finish;

  script.onerror=()=>finish({
    ok:false,
    mensagem:'Não foi possível comunicar com o Apps Script.'
  });

  script.src=API_URL+'?'+q.toString();
  document.body.appendChild(script);

  setTimeout(()=>finish({
    ok:false,
    mensagem:'Tempo esgotado ao comunicar com o servidor.'
  }),15000);
}

function testarAPI(){
  api('status',{},r=>{
    const e=document.getElementById('apiStatus');

    if(r.ok){
      e.textContent='● Sistema online — API V'+esc(r.versao);
      e.style.color='#15803d';
    }else{
      e.textContent='● API indisponível';
      e.style.color='#b91c1c';
      mostrar('error','<b>API indisponível.</b><br>'+esc(r.mensagem));
    }
  });
}

function salvarOperador(){
  localStorage.setItem(
    'cred_operador',
    document.getElementById('operador').value.trim()
  );

  localStorage.setItem(
    'cred_dispositivo',
    document.getElementById('dispositivo').value.trim()
  );
}

function carregarOperador(){
  const operador=localStorage.getItem('cred_operador')||'';
  const dispositivo=localStorage.getItem('cred_dispositivo')||'';

  document.getElementById('operador').value=operador;
  document.getElementById('dispositivo').value=dispositivo;

  document.getElementById('operador').addEventListener('change',salvarOperador);
  document.getElementById('dispositivo').addEventListener('change',salvarOperador);
}

function toggleCamera(){
  scanning?stopCamera():startCamera();
}

async function startCamera(){
  limpar();
  stopCamera();

  const video=document.getElementById('video');
  const status=document.getElementById('cameraStatus');
  const hint=document.getElementById('scanHint');

  if(location.protocol!=='https:' && location.hostname!=='localhost'){
    status.textContent='❌ Esta página não está em HTTPS.';
    mostrar('error','<b>A câmera exige HTTPS.</b><br>Abra a página pelo endereço HTTPS do GitHub Pages.');
    return;
  }

  if(typeof jsQR==='undefined'){
    status.textContent='❌ Leitor QR não carregado.';
    mostrar('error','<b>Biblioteca QR indisponível.</b><br>Verifique a internet ou use o TOKEN manual.');
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    status.textContent='❌ Este navegador não disponibiliza a câmera.';
    mostrar('error','<b>Câmera indisponível neste navegador.</b><br>Use o TOKEN manual.');
    return;
  }

  try{
    status.textContent='⏳ Solicitando acesso à câmera...';

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    video.style.display='block';

    await video.play();

    canvas=document.createElement('canvas');
    ctx=canvas.getContext('2d',{willReadFrequently:true});

    scanning=true;

    document.getElementById('btnCamera').textContent='⏹ PARAR CÂMERA';
    status.textContent='✓ Câmera ativa — aponte para o QR Code.';
    hint.style.display='block';

    scan();

  }catch(e){
    stopCamera();

    let msg='Não foi possível acessar a câmera.';

    if(e.name==='NotAllowedError')
      msg='Permissão da câmera bloqueada. Verifique as permissões do site no navegador.';
    else if(e.name==='NotFoundError')
      msg='Nenhuma câmera foi encontrada.';
    else if(e.name==='NotReadableError')
      msg='A câmera está sendo usada por outro aplicativo.';
    else if(e.name==='SecurityError')
      msg='O navegador bloqueou a câmera por segurança.';

    status.textContent='❌ '+msg;

    mostrar(
      'error',
      '<b>Erro na câmera</b><br>'+esc(msg)+
      '<br><br>Se necessário, use o TOKEN manual.'
    );
  }
}

function scan(){
  if(!scanning)return;

  const video=document.getElementById('video');

  if(video.readyState>=2 && video.videoWidth){
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const image=ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    try{
      const code=jsQR(
        image.data,
        image.width,
        image.height,
        {inversionAttempts:'attemptBoth'}
      );

      if(code?.data){
        const token=String(code.data).trim().toUpperCase();

        stopCamera();
        consultar(token);
        return;
      }

    }catch(e){}
  }

  raf=requestAnimationFrame(scan);
}

function stopCamera(){
  scanning=false;

  if(raf)cancelAnimationFrame(raf);
  raf=null;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  const v=document.getElementById('video');

  v.pause();
  v.srcObject=null;
  v.style.display='none';

  document.getElementById('scanHint').style.display='none';

  document.getElementById('btnCamera').textContent='📷 ESCANEAR QR CODE';
}

function consultarManual(){
  const t=document
    .getElementById('tokenManual')
    .value
    .trim()
    .toUpperCase();

  if(!t){
    mostrar('warning','<b>Digite um TOKEN.</b>');
    return;
  }

  consultar(t);
}

function consultar(token){
  if(busy)return;

  busy=true;

  mostrar(
    'info',
    '🔎 Consultando participante...'
  );

  api('consultar',{token:token},p=>{
    busy=false;

    if(!p.ok){
      mostrar(
        'error',
        '<b>QR/TOKEN NÃO ENCONTRADO</b><br><br>'+
        esc(p.mensagem)+
        '<br><br>'+
        '<button class="secondary" onclick="novo()">NOVO CREDENCIAMENTO</button>'
      );
      return;
    }

    if(p.credenciado){
      mostrar(
        'warning',
        '<b>⚠ PARTICIPANTE JÁ CREDENCIADO</b>'+
        '<div class="name">'+esc(p.nome)+'</div>'+
        '<div>CPF: '+esc(p.cpf)+'</div>'+
        '<br>'+
        '<button class="secondary" onclick="novo(true)">📷 NOVO CREDENCIAMENTO</button>'
      );
      return;
    }

    mostrar(
      'success',
      '<div class="muted">PARTICIPANTE ENCONTRADO</div>'+
      '<div class="name">'+esc(p.nome)+'</div>'+
      '<div>CPF: '+esc(p.cpf)+'</div>'+
      '<br>'+
      '<button class="successBtn" onclick="confirmar(\''+escJS(p.token)+'\')">'+
      '✓ CONFIRMAR CREDENCIAMENTO'+
      '</button>'+
      '<br><br>'+
      '<button class="secondary" onclick="novo()">CANCELAR</button>'
    );
  });
}

function confirmar(token){
  const operador=document
    .getElementById('operador')
    .value
    .trim();

  const dispositivo=document
    .getElementById('dispositivo')
    .value
    .trim();

  if(!operador){
    mostrar(
      'warning',
      '<b>Informe o nome do atendente.</b>'
    );
    document.getElementById('operador').focus();
    return;
  }

  if(!dispositivo){
    mostrar(
      'warning',
      '<b>Informe o posto de credenciamento.</b>'
    );
    document.getElementById('dispositivo').focus();
    return;
  }

  salvarOperador();

  if(busy)return;

  busy=true;

  mostrar(
    'info',
    '⏳ Registrando credenciamento...'
  );

  api(
    'credenciar',
    {
      token:token,
      operador:operador,
      dispositivo:dispositivo
    },
    r=>{
      busy=false;

      if(r.ok){
        document.getElementById('tokenManual').value='';

        mostrar(
          'success',
          '<div style="font-size:42px;text-align:center">✓</div>'+
          '<div class="name" style="text-align:center">CREDENCIAMENTO REALIZADO</div>'+
          '<div style="text-align:center;font-size:17px">'+esc(r.nome)+'</div>'+
          '<br>'+
          '<div style="text-align:center">'+esc(r.data)+' às '+esc(r.hora)+'</div>'+
          '<br>'+
          '<button onclick="novo(true)">📷 LER PRÓXIMO PARTICIPANTE</button>'
        );

      }else{
        mostrar(
          'warning',
          '<b>'+esc(r.mensagem)+'</b>'+
          '<br><br>'+
          '<button class="secondary" onclick="novo(true)">📷 NOVO CREDENCIAMENTO</button>'
        );
      }
    }
  );
}

function novo(iniciarCamera=false){
  document.getElementById('tokenManual').value='';

  limpar();
  stopCamera();

  document.getElementById('cameraStatus').textContent=
    'Câmera pronta para iniciar.';

  if(iniciarCamera){
    startCamera();
  }else{
    document.getElementById('tokenManual').focus();
  }
}

function mostrar(tipo,html){
  const e=document.getElementById('mensagem');

  e.className='result '+tipo;
  e.innerHTML=html;
}

function limpar(){
  const e=document.getElementById('mensagem');

  e.className='';
  e.innerHTML='';
}

window.addEventListener('load',()=>{
  carregarOperador();
  testarAPI();
});
</script>

</body>
</html>
